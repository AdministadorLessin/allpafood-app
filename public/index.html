<!DOCTYPE html>
<!-- El contenido esta en espanol. Declararlo como "en" hacia que Chrome
     ofreciera traducir la pagina al espanol: el traductor reemplaza los
     nodos de texto y despues React no encuentra los suyos, revienta la
     pantalla y el cliente ve "Algo se nos rompio". Paso con 10 clientes
     el 25/09/2026, todos en Mi menu. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#35F09A" />

    <!-- Lo que se ve cuando alguien pega el enlace en WhatsApp.
         Sin estas etiquetas, WhatsApp mostraba el texto que trae React de
         fabrica: "Web site created using create-react-app". Justo debajo del
         nombre de la marca, en el mensaje que reciben los clientes. -->
    <meta
      name="description"
      content="Tu plan de almuerzos Allpa Food: elige tus platos de la semana, sigue tu entrega del día y revisa tus envíos."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allpa Food" />
    <meta property="og:title" content="Allpa Food · Tu plan de almuerzos" />
    <meta
      property="og:description"
      content="Elige tus platos de la semana, sigue tu entrega del día y revisa tus envíos."
    />
    <meta property="og:url" content="https://app.allpafood.com/" />
    <!-- Absoluta a proposito: WhatsApp no resuelve rutas relativas. -->
    <meta property="og:image" content="https://app.allpafood.com/og-allpafood.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_PE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Allpa Food · Tu plan de almuerzos" />
    <meta
      name="twitter:description"
      content="Elige tus platos de la semana, sigue tu entrega del día y revisa tus envíos."
    />
    <meta name="twitter:image" content="https://app.allpafood.com/og-allpafood.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Days+One&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Allpafood</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
